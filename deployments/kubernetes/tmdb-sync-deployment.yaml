apiVersion: apps/v1
kind: Deployment
metadata:
  name: tmdb-sync
  labels:
    app: tmdb-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tmdb-sync
  template:
    metadata:
      labels:
        app: tmdb-sync
    spec:
      containers:
        - name: tmdb-sync
          image: tmdb-sync:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: tmdb-sync-config
            - secretRef:
                name: letterboxd-api-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
