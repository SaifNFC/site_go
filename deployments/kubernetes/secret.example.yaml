# Copie ce fichier en secret.yaml (gitignore) et remplace les valeurs avant de l'appliquer :
#   cp secret.example.yaml secret.yaml
#   kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: letterboxd-api-secret
  labels:
    app: letterboxd-api
type: Opaque
stringData:
  DATABASE_URL: "postgres://user:password@host/dbname?sslmode=require"
  JWT_SECRET: "changeme"
  TMDB_API_KEY: "changeme"
