apiVersion: apps/v1
kind: Deployment
metadata:
  name: filmsync-operator
  labels:
    app: filmsync-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filmsync-operator
  template:
    metadata:
      labels:
        app: filmsync-operator
    spec:
      serviceAccountName: filmsync-operator
      containers:
        - name: filmsync-operator
          image: filmsync-operator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: probes
          envFrom:
            - configMapRef:
                name: letterboxd-api-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
