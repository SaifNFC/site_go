apiVersion: apps/v1
kind: Deployment
metadata:
  name: letterboxd-api
  labels:
    app: letterboxd-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: letterboxd-api
  template:
    metadata:
      labels:
        app: letterboxd-api
    spec:
      containers:
        - name: api
          image: letterboxd-clone:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: letterboxd-api-config
            - secretRef:
                name: letterboxd-api-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
