apiVersion: v1
kind: ServiceAccount
metadata:
  name: filmsync-operator
  labels:
    app: filmsync-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filmsync-operator
  labels:
    app: filmsync-operator
rules:
  - apiGroups: ["sync.letterboxd.dev"]
    resources: ["filmsyncs"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["sync.letterboxd.dev"]
    resources: ["filmsyncs/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filmsync-operator
  labels:
    app: filmsync-operator
subjects:
  - kind: ServiceAccount
    name: filmsync-operator
    namespace: default
roleRef:
  kind: ClusterRole
  name: filmsync-operator
  apiGroup: rbac.authorization.k8s.io
